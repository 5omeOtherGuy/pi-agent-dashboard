name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # main pushes get their own group each, so a queued main run is never replaced.
  group: gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The tmux tests skip without tmux, and the runner image does not ship it.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux > /dev/null
      - run: npm ci
      - run: npm run gate
